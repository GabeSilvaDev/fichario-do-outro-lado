name: ordem_paranormal
description: "Fichário do Outro Lado: ficha de personagem e mesa online para RPG de horror
  moderno. Conteúdo não oficial, publicado sob a Licença da Comunidade de
  Ordem Paranormal."
publish_to: 'none'

version: 0.9.1+15

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # busca sem acento (percorre grafemas, não bytes)
  characters: ^1.4.0

  # Fichas salvas no aparelho (offline por padrão)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1

  # Exportar/importar ficha e escolher imagens
  share_plus: ^10.1.4
  file_picker: ^10.3.3
  image: ^4.9.1

  # Mesa online (ligada só quando alguém entra numa mesa)
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Dados do sistema: só mecânica (nomes de perícia/origem/classe e números).
  # Nenhum texto dos livros oficiais é reproduzido aqui — ver LICENCA.md.
  assets:
    - assets/data/
    - assets/licenca/
    - assets/bestiario/
    - assets/catalogo/
