name: ordem_paranormal
description: "Fichário do Outro Lado: ficha de personagem e mesa online para RPG de horror
  moderno. Conteúdo não oficial, publicado sob a Licença da Comunidade de
  Ordem Paranormal."
publish_to: 'none'

version: 0.10.2+19

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  characters: ^1.4.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1

  share_plus: ^10.1.4
  file_picker: ^10.3.3
  image: ^4.9.1

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/capa_aplicativo.png
    - assets/data/
    - assets/licenca/
    - assets/bestiario/
    - assets/catalogo/
